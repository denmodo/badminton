<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 Chia bảng bằng vòng quay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<!-- Firebase Realtime Database (dùng CHUNG dữ liệu với index.html) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--soft:rgba(148,163,184,.14);--soft2:rgba(148,163,184,.22);--input:#fff;}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--line:#334155;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--soft:rgba(148,163,184,.14);--soft2:rgba(148,163,184,.24);--input:#0f172a;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Vietnamese",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.container{max-width:1200px;margin:auto;padding:20px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px #1018280a}
.layout{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;touch-action:manipulation;font-family:inherit;font-size:15px}
button.secondary{background:#475467}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{display:block;width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:800}
.btn.secondary{background:var(--soft2);color:var(--text)}
.result{margin-top:14px;min-height:44px;text-align:center;font-size:16px;font-weight:800;color:var(--accent);background:var(--soft);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center}
.remaining{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--muted)}
textarea,input[type=number]{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;font-weight:600}
textarea{height:210px;resize:vertical}
.row{margin-top:14px}
.wheel-wrap{position:relative;width:100%;max-width:340px;aspect-ratio:1/1;margin:0 auto}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--warn);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.group{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:140px}
.group h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.group h3 .gname{display:inline-flex;align-items:center;gap:6px}
.group h3 .gpre{font-size:15px;font-weight:800;color:var(--muted)}
.group h3 .gname span{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;font-size:14px;font-weight:900}
.group h3 > span:last-child{font-size:12px;color:var(--muted);font-weight:700;background:var(--soft2);border-radius:999px;padding:2px 8px}
.group ol{margin:0;padding-left:22px}
.group li{padding:4px 0;font-weight:700;animation:pop .4s ease}
.group li.new{color:var(--warn)}
.empty{color:var(--muted);font-size:13px;font-style:italic}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.sync{margin-top:6px;font-size:13px;font-weight:700;color:var(--ok);min-height:18px}
.sync.err{color:var(--warn)}
.sync.busy{color:var(--muted)}
.dark-toggle{position:fixed;bottom:16px;right:16px;z-index:999;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 12px #00000026;font-size:20px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
</style>
</head>
<body>

<div class="container">
  <h1>🎡 Chia bảng bằng vòng quay</h1>
  <div class="sub">Quay để bốc từng đội vào bảng · chia đều số đội mỗi bảng · quay xong tự đồng bộ sang trang giải đấu.</div>

  <div class="layout">
    <!-- Cột trái: vòng quay + điều khiển -->
    <div class="card">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="680" height="680"></canvas>
      </div>

      <button class="btn" id="spinBtn">QUAY</button>
      <div class="result" id="result">Nhấn QUAY để bốc đội</div>
      <div class="remaining" id="remaining"></div>
      <div class="sync" id="syncStatus"></div>

      <div class="row">
        <label for="teamInput">Danh sách đội (mỗi dòng 1 đội · nên nhập 1–6 hoặc A–F)</label>
        <textarea id="teamInput"></textarea>
      </div>
      <div class="row">
        <label for="groupCount">Số bảng (tối đa 26)</label>
        <input type="number" id="groupCount" min="1" max="26" value="2">
      </div>
      <button class="btn secondary" id="applyBtn">Áp dụng &amp; làm lại</button>
    </div>

    <!-- Cột phải: các bảng -->
    <div class="card">
      <div class="groups" id="groups"></div>
    </div>
  </div>
</div>

<button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Chế độ tối/sáng">🌙</button>

<script>
  const $ = id => document.getElementById(id);
  const canvas = $('wheel');
  const ctx = canvas.getContext('2d');
  const R = canvas.width / 2;
  const TWO_PI = Math.PI * 2;

  /* Bảng màu đồng bộ với index.html (đỏ, xanh, cam, lục, tím, lam) */
  const PALETTE = ["#dc2626","#2563eb","#ea580c","#059669","#7c3aed","#0891b2"];
  const GCOLOR  = {"A":"#2563eb","B":"#ea580c","C":"#059669","D":"#7c3aed","E":"#0891b2","F":"#dc2626"};

  let remaining = [];   // các đội còn trên vòng quay
  let groups = [];      // [{name, teams:[], cap}]
  let rotation = 0;     // góc hiện tại của vòng quay (radian)
  let spinning = false;
  let lastPlaced = null;

  /* ---------- Firebase (cùng project + node với index.html) ---------- */
  const FIREBASE_CONFIG={apiKey:"AIzaSyAq9N2fkROcpKFcobgd2PFLvckljSkKaNY",databaseURL:"https://youcanseefuture.firebaseio.com",projectId:"youcanseefuture",authDomain:"youcanseefuture.firebaseapp.com",storageBucket:"youcanseefuture.firebasestorage.app",messagingSenderId:"456240353181",appId:"1:456240353181:web:c1e9fd6ccb3e4145302974"};
  const RDB="badminton";
  let remoteDB=null;
  try{
    if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL){
      firebase.initializeApp(FIREBASE_CONFIG);
      remoteDB=firebase.database();
    }
  }catch(e){remoteDB=null}

  /* Quy đổi tên đội trên vòng quay → id nội bộ của index.html (A–F) */
  const TID_BY_NUM={1:"A",2:"B",3:"C",4:"D",5:"E",6:"F"};
  function toTid(name){
    const s=String(name==null?"":name).trim();
    if(!s)return null;
    const up=s.toUpperCase();
    if(/^[A-F]$/.test(up))return up;                       // A…F
    const m=s.match(/(\d+)\s*$/);                           // "3", "Đội 3", "Team 3"
    if(m){const n=parseInt(m[1],10);if(TID_BY_NUM[n])return TID_BY_NUM[n];}
    return null;
  }

  function setSync(t,err,busy){
    const el=$("syncStatus");if(!el)return;
    el.textContent=t||"";
    el.className="sync"+(err?" err":"")+(busy?" busy":"");
    // Lỗi thì bấm vào để thử đồng bộ lại
    el.style.cursor=(err&&remaining.length===0)?"pointer":"default";
    el.onclick=(err&&remaining.length===0)?syncToCloud:null;
  }

  /* Quay xong → tự ghi bảng đấu sang Firebase để index.html nhận ngay */
  function syncToCloud(){
    if(!remoteDB){setSync("⚠️ Chưa kết nối được cloud — chỉ xem trên máy này.",true);return}
    if(groups.length!==2){
      setSync("ℹ️ Chỉ đồng bộ được khi chia đúng 2 bảng (Bảng A/B).",true);return;
    }
    const gA=groups[0].teams.map(toTid);
    const gB=groups[1].teams.map(toTid);
    const all=[...gA,...gB];
    if(all.some(x=>!x)){
      setSync("⚠️ Không đồng bộ được: tên đội phải là 1–6 (hoặc A–F).",true);return;
    }
    if(new Set(all).size!==all.length){
      setSync("⚠️ Không đồng bộ được: có đội bị trùng.",true);return;
    }
    if(gA.length!==3||gB.length!==3){
      setSync("ℹ️ Cần đúng 3 đội mỗi bảng mới đồng bộ được.",true);return;
    }

    setSync("Đang đồng bộ sang trang giải đấu…",false,true);
    const payload={
      groups:{g1:gA.slice().sort(),g2:gB.slice().sort()},
      results:null                                   // đổi bảng → xoá toàn bộ điểm (kể cả chung kết)
    };
    remoteDB.ref(RDB).update(payload).then(()=>{
      setSync("✅ Đã đồng bộ Bảng A = "+gA.slice().sort().join(", ")+" · Bảng B = "+gB.slice().sort().join(", ")+" (điểm cũ đã xoá).");
    }).catch(()=>{
      setSync("⚠️ Lỗi mạng — chưa đồng bộ được, hãy bấm quay lại.",true);
    });
  }

  /* ---------- Dark mode (dùng chung key với index.html → bật ở trang nào cũng nhớ) ---------- */
  function darkState(){try{return localStorage.getItem("bathon_dark")==="1"}catch(_){return false}}
  function setDark(v){try{localStorage.setItem("bathon_dark",v?"1":"0")}catch(_){}}
  function applyDarkState(){
    const d=darkState();
    document.body.classList.toggle("dark",d);
    const bt=$("darkToggle");if(bt)bt.textContent=d?"☀️":"🌙";
  }
  function toggleDark(){
    const d=!document.body.classList.contains("dark");
    document.body.classList.toggle("dark",d);setDark(d);
    const bt=$("darkToggle");if(bt)bt.textContent=d?"☀️":"🌙";
    drawWheel();   // vẽ lại vòng quay theo nền mới
  }
  const isDark=()=>document.body.classList.contains("dark");

  // ---------- Khởi tạo ----------
  function init() {
    const names = $('teamInput').value
      .split('\n').map(s => s.trim()).filter(Boolean);
    let k = parseInt($('groupCount').value, 10);
    if (isNaN(k) || k < 1) k = 1;
    if (k > 26) k = 26;
    $('groupCount').value = k;

    const n = names.length;
    const base = Math.floor(n / k);
    const extra = n % k;

    groups = Array.from({ length: k }, (_, i) => ({
      name: String.fromCharCode(65 + i),
      teams: [],
      cap: base + (i < extra ? 1 : 0)   // số đội tối đa của mỗi bảng
    }));

    remaining = [...names];
    rotation = 0;
    lastPlaced = null;
    $('result').textContent = n ? 'Nhấn QUAY để bốc đội' : 'Hãy nhập danh sách đội';
    $('spinBtn').disabled = n === 0;
    setSync('');

    renderGroups();
    drawWheel();
    updateRemaining();
  }

  // ---------- Vẽ vòng quay ----------
  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const n = remaining.length;
    const bg = isDark() ? '#0f172a' : '#ffffff';

    if (n === 0) {
      ctx.beginPath();
      ctx.arc(R, R, R - 8, 0, TWO_PI);
      ctx.fillStyle = isDark() ? '#334155' : '#e2e8f0';
      ctx.fill();
      ctx.fillStyle = isDark() ? '#e2e8f0' : '#475467';
      ctx.font = '900 44px "Be Vietnam Pro", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HẾT ĐỘI', R, R);
      return;
    }

    const seg = TWO_PI / n;
    const fontSize = Math.max(11, Math.min(28, 380 / n));

    for (let i = 0; i < n; i++) {
      const start = rotation + i * seg;
      const end = start + seg;
      const col = PALETTE[i % PALETTE.length];

      ctx.beginPath();
      ctx.moveTo(R, R);
      ctx.arc(R, R, R - 8, start, end);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      ctx.strokeStyle = bg;
      ctx.lineWidth = 3;
      ctx.stroke();

      // Ghi tên đội theo hướng bán kính (tự lật chữ để không bị ngược)
      const mid = start + seg / 2;
      const cm = Math.cos(mid);
      // lật khi chữ sẽ bị ngược; đoạn thẳng đứng (cos≈0) thì lật nếu hướng lên
      const flip = (cm < -1e-9) || (Math.abs(cm) <= 1e-9 && Math.sin(mid) < 0);
      const maxW = R - 92;                     // không cho chữ tràn vào tâm
      ctx.save();
      ctx.translate(R, R);
      ctx.rotate(mid + (flip ? Math.PI : 0));
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.font = `800 ${fontSize}px "Be Vietnam Pro", system-ui, sans-serif`;
      let label = remaining[i];
      if (label.length > 18) label = label.slice(0, 17) + '…';
      if (flip) { ctx.textAlign = 'left';  ctx.fillText(label, -(R - 26), 0, maxW); }
      else      { ctx.textAlign = 'right'; ctx.fillText(label,    R - 26 , 0, maxW); }
      ctx.restore();
    }

    // Tâm vòng quay
    ctx.beginPath();
    ctx.arc(R, R, 20, 0, TWO_PI);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = isDark() ? '#334155' : '#e5e7eb';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ---------- Quay ----------
  function spin() {
    if (spinning || remaining.length === 0) return;
    if (remaining.length === 1) { autoPlaceLast(); return; }   // thêm dòng này

    spinning = true;
    $('spinBtn').disabled = true;
    $('result').textContent = 'Đang quay...';
    lastPlaced = null;

    const n = remaining.length;
    const seg = TWO_PI / n;
    const w = Math.floor(Math.random() * n);          // đội trúng
    // Góc quay sao cho tâm đoạn w nằm ngay dưới kim chỉ (đỉnh trên cùng)
    const targetRot = -Math.PI / 2 - (w * seg + seg / 2);

    const baseMod = ((rotation % TWO_PI) + TWO_PI) % TWO_PI;
    const targetMod = ((targetRot % TWO_PI) + TWO_PI) % TWO_PI;
    const delta = (targetMod - baseMod + TWO_PI) % TWO_PI;

    const from = rotation;
    const to = rotation + 6 * TWO_PI + delta;         // quay thêm 6 vòng cho đẹp
    const duration = 4500;
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - t, 4);           // easing giảm tốc
      rotation = from + (to - from) * eased;
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = to;
        finish(w);
      }
    }
    requestAnimationFrame(frame);
  }

   // ---------- Xếp đội vào bảng ----------
  function finish(index) {
    spinning = false;

    const team = remaining.splice(index, 1)[0];

    // Chọn ngẫu nhiên trong các bảng còn chỗ
    const open = groups.filter(g => g.teams.length < g.cap);
    const group = open[Math.floor(Math.random() * open.length)];
    group.teams.push(team);
    lastPlaced = { team, group: group.name };

    $('result').textContent = `${team} → Bảng ${group.name}`;
    refresh();

    // Còn đúng 1 đội: tự xếp vào bảng còn lại, không cần quay
    if (remaining.length === 1) {
      autoPlaceLast();
    } else if (remaining.length === 0) {
      syncToCloud();   // quay xong hết → đồng bộ sang index.html
    }
  }

  // Xếp đội cuối cùng vào bảng còn chỗ, không quay
  function autoPlaceLast() {
    const team = remaining.pop();
    const group = groups.find(g => g.teams.length < g.cap);
    group.teams.push(team);
    lastPlaced = { team, group: group.name };

    refresh();
    $('result').textContent = `✅ Đã chia xong! ${team} → Bảng ${group.name} (tự động)`;
    syncToCloud();   // chia xong toàn bộ → đồng bộ sang index.html
  }

  // Cập nhật toàn bộ giao diện sau mỗi thay đổi
  function refresh() {
    renderGroups();
    drawWheel();
    updateRemaining();
    $('spinBtn').disabled = remaining.length === 0;
  }

  // ---------- Hiển thị ----------
  function renderGroups() {
    const box = $('groups');
    box.innerHTML = '';
    groups.forEach(g => {
      const col = GCOLOR[g.name] || PALETTE[0];
      const card = document.createElement('div');
      card.className = 'group';
      card.style.borderLeftColor = col;

      const title = document.createElement('h3');
      const wrap = document.createElement('span');
      wrap.className = 'gname';
      const pre = document.createElement('span');
      pre.className = 'gpre';
      pre.textContent = 'Bảng';
      const badge = document.createElement('span');
      badge.style.background = col;
      badge.style.color = '#fff';
      badge.textContent = g.name;
      wrap.appendChild(pre);
      wrap.appendChild(badge);
      const count = document.createElement('span');
      count.textContent = `${g.teams.length}/${g.cap}`;
      title.appendChild(wrap);
      title.appendChild(count);
      card.appendChild(title);

      if (g.teams.length === 0) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'Chưa có đội';
        card.appendChild(e);
      } else {
        const ol = document.createElement('ol');
        g.teams.forEach(t => {
          const li = document.createElement('li');
          li.textContent = t;
          if (lastPlaced && lastPlaced.team === t) li.className = 'new';
          ol.appendChild(li);
        });
        card.appendChild(ol);
      }
      box.appendChild(card);
    });
  }

  function updateRemaining() {
    $('remaining').textContent = `Còn ${remaining.length} đội chưa được bốc`;
  }

  // ---------- Sự kiện ----------
  $('spinBtn').addEventListener('click', spin);
  $('applyBtn').addEventListener('click', init);

  // Dữ liệu mẫu: 6 đội — dùng số 1–6 để tự đồng bộ được với trang giải đấu
  $('teamInput').value = Array.from({ length: 6 }, (_, i) => String(i + 1)).join('\n');
  applyDarkState();
  init();
</script>
</body>
</html>
